name: Portfolio documentation governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python tools/validate_security_portfolio_projection.py
      - run: python tools/validate_portfolio_governance.py
      - run: python -m unittest discover -s tests -p "test_*.py" -v
